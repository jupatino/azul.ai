[project]
name = "azul-ai"
version = "0.1.0"
description = "Multi-channel AI agent with persistent sessions and skills storage"
readme = "README.md"
authors = [
    { email = "juan_patino@yahoo.com" }
]
requires-python = ">=3.15"
dependencies = [
    "flask>=3.1",
    "gunicorn>=23",
    "openai>=3.57.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.2.4",
    "slack-bolt>=1.26",
]

[project.scripts]
azul-ai = "azul_ai.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
