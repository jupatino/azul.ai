name: Reconcile Slack merge notifications

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Merged PR number to notify (leave blank to scan recent merges)"
        required: false
        type: string

permissions: {}

jobs:
  notify-merged:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack about unreported merges
        env:
          AUTO_MERGE_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ -z "$AUTO_MERGE_TOKEN" || -z "$SLACK_BOT_TOKEN" || -z "$SLACK_CHANNEL_ID" ]]; then
            echo "::error::Configure AUTO_MERGE_TOKEN, SLACK_BOT_TOKEN, and SLACK_CHANNEL_ID repository Actions secrets."
            exit 1
          fi
          export GH_TOKEN="$AUTO_MERGE_TOKEN"

          merge_marker="<!-- slack-merge-notified -->"

          notify_merged_pr() {
            local pr_json="$1"
            local number title url author base notified message payload response error

            number="$(jq -r '.number' <<<"$pr_json")"
            title="$(jq -r '.title' <<<"$pr_json")"
            url="$(jq -r '.url' <<<"$pr_json")"
            author="$(jq -r '.author.login // "unknown"' <<<"$pr_json")"
            base="$(jq -r '.baseRefName' <<<"$pr_json")"

            if [[ "$(jq -r '.state' <<<"$pr_json")" != "MERGED" || "$base" != "main" ]]; then
              echo "::error::PR #$number is not a merged pull request targeting main."
              return 1
            fi

            notified="$(gh pr view "$number" --json comments \
              --jq 'any(.comments[]?; .body == "<!-- slack-merge-notified -->")')"
            if [[ "$notified" == "true" ]]; then
              echo "The merge notification for PR #$number was already sent."
              return
            fi

            printf -v message 'Pull request merged: PR #%s: %s\nAuthor: %s | Base: %s\n%s' \
              "$number" "$title" "$author" "$base" "$url"
            payload="$(jq -n \
              --arg text "$message" \
              --arg url "$url" \
              --arg number "$number" \
              --arg title "$title" \
              --arg author "$author" \
              --arg base "$base" \
              --arg channel "$SLACK_CHANNEL_ID" \
              '{
                channel: $channel,
                text: $text,
                blocks: [
                  {
                    type: "context",
                    elements: [
                      {
                        type: "image",
                        image_url: "https://raw.githubusercontent.com/jupatino/azul.ai/main/assets/slack/pr-merged-v2.png",
                        alt_text: "Pull request merged"
                      },
                      {type: "mrkdwn", text: "*Pull request merged*"}
                    ]
                  },
                  {
                    type: "section",
                    text: {type: "mrkdwn", text: ("<" + $url + "|PR #" + $number + ": " + $title + ">")}
                  },
                  {
                    type: "context",
                    elements: [{type: "mrkdwn", text: ("Author: " + $author + " | Base: " + $base)}]
                  }
                ]
              }')"

            response="$(curl --fail --silent --show-error \
              -H "Authorization: ******" \
              -H "Content-Type: application/json; charset=utf-8" \
              --data "$payload" \
              https://slack.com/api/chat.postMessage)"
            if ! jq -e '.ok == true' <<<"$response" >/dev/null; then
              error="$(jq -r '.error // "unknown_error"' <<<"$response")"
              echo "::error::Slack API rejected the merge notification for PR #$number: $error"
              return 1
            fi

            gh pr comment "$number" --body "$merge_marker"
          }

          if [[ -n "$PR_NUMBER" ]]; then
            pr_json="$(gh pr view "$PR_NUMBER" \
              --json number,title,url,author,baseRefName,state)"
            notify_merged_pr "$pr_json"
            exit
          fi

          # Start reconciliation from the first missed automated merge; do not replay older notifications.
          merge_scan_since="2026-11-22T10:56:10Z"
          while IFS= read -r pr_json; do
            [[ -z "$pr_json" ]] || notify_merged_pr "$pr_json"
          done < <(gh pr list --state merged --base main --limit 100 \
            --json number,title,url,author,baseRefName,state,mergedAt \
            --jq ".[] | select(.mergedAt >= \"$merge_scan_since\") | @json")
