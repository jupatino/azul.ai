name: Auto-merge pull requests

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail

          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::The workflow GITHUB_TOKEN is unavailable."
            exit 1
          fi

          enable_auto_merge() {
            local pr_url="$1"
            local is_enabled
            is_enabled="$(gh pr view "$pr_url" --json autoMergeRequest --jq '.autoMergeRequest != null')"
            if [[ "$is_enabled" == "true" ]]; then
              echo "Auto-merge is already enabled for $pr_url."
              return
            fi
            gh pr merge "$pr_url" --auto --merge
          }

          if [[ "$EVENT_NAME" == "push" ]]; then
            while IFS= read -r pr_url; do
              [[ -z "$pr_url" ]] || enable_auto_merge "$pr_url"
            done < <(gh pr list --state open --base main --json url,isDraft \
              --jq '.[] | select(.isDraft == false) | .url')
          else
            enable_auto_merge "$PR_URL"
          fi
