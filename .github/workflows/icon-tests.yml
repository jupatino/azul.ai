name: Icon asset tests

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/icon-tests.yml
      - openclaw-icon.png
      - openclaw-icon.svg
      - tests/test_icon_assets.py

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Validate icon assets
        run: python -m unittest discover -s tests -p test_icon_assets.py -v
