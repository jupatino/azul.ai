name: Tests

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack that tests started
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          ICON_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/assets/slack/tests-started.png
        run: |
          set -euo pipefail
          if [[ -z "$SLACK_BOT_TOKEN" && -z "$SLACK_CHANNEL_ID" && -z "$SLACK_WEBHOOK_URL" ]]; then
            echo "::warning::Slack notification credentials are not configured; skipping Slack notification."
            exit 0
          fi

          status_label="Tests started"
          printf -v message '%s\nPR #%s: %s' "$status_label" "$PR_NUMBER" "$PR_TITLE"
          customize_sender=false
          if [[ -n "$SLACK_BOT_TOKEN" && -n "$SLACK_CHANNEL_ID" ]]; then
            customize_sender=true
          fi
          payload="$(jq -n \
            --arg text "$message" \
            --arg icon_url "$ICON_URL" \
            --arg status_label "$status_label" \
            --arg pr_url "$PR_URL" \
            --arg pr_number "$PR_NUMBER" \
            --arg pr_title "$PR_TITLE" \
            --arg channel "$SLACK_CHANNEL_ID" \
            --arg avatar_url "https://raw.githubusercontent.com/jupatino/azul.ai/main/azul-agent-icon.png" \
            --argjson customize_sender "$customize_sender" \
            '{
              text: $text,
              blocks: [
                {type: "context", elements: [
                  {type: "image", image_url: $icon_url, alt_text: $status_label},
                  {type: "mrkdwn", text: ("*" + $status_label + "*")}
                ]},
                {type: "section", text: {type: "mrkdwn", text: ("<" + $pr_url + "|PR #" + $pr_number + ": " + $pr_title + ">")}}
              ]
            } + (if $customize_sender then {
              channel: $channel,
              username: "azul.ai AGENT",
              icon_url: $avatar_url
            } end)')"
          if [[ -n "$SLACK_BOT_TOKEN" && -n "$SLACK_CHANNEL_ID" ]]; then
            response="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
              -H "Content-Type: application/json; charset=utf-8" \
              --data "$payload" \
              https://slack.com/api/chat.postMessage)"
            if ! jq -e '.ok == true' <<<"$response" >/dev/null; then
              error="$(jq -r '.error // "unknown_error"' <<<"$response")"
              echo "::error::Slack API rejected the test-start notification: $error"
              exit 1
            fi
          elif [[ -n "$SLACK_WEBHOOK_URL" ]]; then
            echo "::warning::Using Slack webhook; configure SLACK_BOT_TOKEN and SLACK_CHANNEL_ID with chat:write.customize to show the Azul sender avatar."
            curl --fail --silent --show-error \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "$SLACK_WEBHOOK_URL"
          else
            echo "::warning::Slack notification skipped; configure both SLACK_BOT_TOKEN and SLACK_CHANNEL_ID."
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests with coverage
        run: |
          uv run --frozen coverage run --branch --source=src/azul_ai \
            -m unittest discover -s tests -v
          uv run --frozen coverage report --show-missing

      - name: Compile source
        run: uv run --frozen python -m compileall -q src tests

      - name: Notify Slack that tests completed
        if: always()
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          TEST_STATUS: ${{ job.status }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          if [[ -z "$SLACK_BOT_TOKEN" && -z "$SLACK_CHANNEL_ID" && -z "$SLACK_WEBHOOK_URL" ]]; then
            echo "::warning::Slack notification credentials are not configured; skipping Slack notification."
            exit 0
          fi

          case "$TEST_STATUS" in
            success)
              icon_file="tests-passed.png"
              status_label="Tests passed"
              ;;
            failure)
              icon_file="tests-failed.png"
              status_label="Tests failed"
              ;;
            cancelled)
              icon_file="tests-cancelled.png"
              status_label="Tests cancelled"
              ;;
            *)
              icon_file=""
              status_label="Tests ${TEST_STATUS}"
              ;;
          esac

          icon_url=""
          if [[ -n "$icon_file" ]]; then
            icon_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/assets/slack/${icon_file}"
          fi
          printf -v message '%s\nPR #%s: %s' "$status_label" "$PR_NUMBER" "$PR_TITLE"
          customize_sender=false
          if [[ -n "$SLACK_BOT_TOKEN" && -n "$SLACK_CHANNEL_ID" ]]; then
            customize_sender=true
          fi
          payload="$(jq -n \
            --arg text "$message" \
            --arg icon_url "$icon_url" \
            --arg status_label "$status_label" \
            --arg pr_url "$PR_URL" \
            --arg pr_number "$PR_NUMBER" \
            --arg pr_title "$PR_TITLE" \
            --arg channel "$SLACK_CHANNEL_ID" \
            --arg avatar_url "https://raw.githubusercontent.com/jupatino/azul.ai/main/azul-agent-icon.png" \
            --argjson customize_sender "$customize_sender" \
            '{
              text: $text,
              blocks: [
                {type: "context", elements:
                  (if $icon_url == "" then
                    [{type: "mrkdwn", text: ("*" + $status_label + "*")}]
                  else
                    [
                      {type: "image", image_url: $icon_url, alt_text: $status_label},
                      {type: "mrkdwn", text: ("*" + $status_label + "*")}
                    ]
                  end)
                },
                {type: "section", text: {type: "mrkdwn", text: ("<" + $pr_url + "|PR #" + $pr_number + ": " + $pr_title + ">")}}
              ]
            } + (if $customize_sender then {
              channel: $channel,
              username: "azul.ai AGENT",
              icon_url: $avatar_url
            } end)')"
          if [[ -n "$SLACK_BOT_TOKEN" && -n "$SLACK_CHANNEL_ID" ]]; then
            response="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
              -H "Content-Type: application/json; charset=utf-8" \
              --data "$payload" \
              https://slack.com/api/chat.postMessage)"
            if ! jq -e '.ok == true' <<<"$response" >/dev/null; then
              error="$(jq -r '.error // "unknown_error"' <<<"$response")"
              echo "::error::Slack API rejected the test-completion notification: $error"
              exit 1
            fi
          elif [[ -n "$SLACK_WEBHOOK_URL" ]]; then
            echo "::warning::Using Slack webhook; configure SLACK_BOT_TOKEN and SLACK_CHANNEL_ID with chat:write.customize to show the Azul sender avatar."
            curl --fail --silent --show-error \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "$SLACK_WEBHOOK_URL"
          else
            echo "::warning::Slack notification skipped; configure both SLACK_BOT_TOKEN and SLACK_CHANNEL_ID."
          fi
