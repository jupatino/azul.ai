name: Slack PR notifications

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, closed]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send notification to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PR_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
        run: |
          set -euo pipefail

          if [[ -z "$SLACK_WEBHOOK_URL" ]]; then
            echo "SLACK_WEBHOOK_URL is not configured."
            exit 1
          fi

          case "$PR_ACTION" in
            closed)
              if [[ "$PR_MERGED" == "true" ]]; then
                status_icon=":small_green_diamond:"
                status_label="Pull request merged"
              else
                status_icon=":small_red_triangle:"
                status_label="Pull request closed"
              fi
              ;;
            synchronize)
              status_icon=":small_orange_diamond:"
              status_label="Pull request updated"
              ;;
            ready_for_review)
              status_icon=":small_green_diamond:"
              status_label="Ready for review"
              ;;
            reopened)
              status_icon=":small_blue_diamond:"
              status_label="Pull request reopened"
              ;;
            *)
              status_icon=":small_blue_diamond:"
              status_label="New pull request"
              ;;
          esac

          printf -v message '%s *%s*\n<%s|PR #%s: %s>\nAuthor: %s | Base: %s' \
            "$status_icon" "$status_label" "$PR_URL" "$PR_NUMBER" "$PR_TITLE" \
            "$PR_AUTHOR" "$PR_BASE"
          payload="$(jq -n \
            --arg text "$message" \
            '{text: $text, mrkdwn: true}')"

          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"
