name: Slack PR notifications

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, closed]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send notification to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
          PR_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
        run: |
          set -euo pipefail

          if [[ -z "$SLACK_BOT_TOKEN" || -z "$SLACK_CHANNEL_ID" ]]; then
            echo "::error::Configure SLACK_BOT_TOKEN and SLACK_CHANNEL_ID with the existing azul.ai bot."
            exit 1
          fi

          merge_marker="<!-- slack-merge-notified -->"
          if [[ "$PR_ACTION" == "closed" && "$PR_MERGED" == "true" ]]; then
            notified="$(gh pr view "$PR_NUMBER" --json comments \
              --jq 'any(.comments[]?; .body == "<!-- slack-merge-notified -->")')"
            if [[ "$notified" == "true" ]]; then
              echo "The merge notification for PR #$PR_NUMBER was already sent."
              exit 0
            fi
          fi

          case "$PR_ACTION" in
            closed)
              if [[ "$PR_MERGED" == "true" ]]; then
                status_icon_url="https://raw.githubusercontent.com/jupatino/azul.ai/main/assets/slack/pr-merged-v2.png"
                status_label="Pull request merged"
              else
                status_icon_url=""
                status_label="Pull request closed"
              fi
              ;;
            synchronize)
              status_icon_url="https://raw.githubusercontent.com/jupatino/azul.ai/main/assets/slack/pr-open-v2.png"
              status_label="Pull request updated"
              ;;
            ready_for_review)
              status_icon_url="https://raw.githubusercontent.com/jupatino/azul.ai/main/assets/slack/pr-open-v2.png"
              status_label="Ready for review"
              ;;
            reopened)
              status_icon_url="https://raw.githubusercontent.com/jupatino/azul.ai/main/assets/slack/pr-open-v2.png"
              status_label="Pull request reopened"
              ;;
            *)
              status_icon_url="https://raw.githubusercontent.com/jupatino/azul.ai/main/assets/slack/pr-open-v2.png"
              status_label="New pull request"
              ;;
          esac

          printf -v message '%s: PR #%s: %s\nAuthor: %s | Base: %s\n%s' \
            "$status_label" "$PR_NUMBER" "$PR_TITLE" "$PR_AUTHOR" "$PR_BASE" "$PR_URL"
          payload="$(jq -n \
            --arg text "$message" \
            --arg status "$status_label" \
            --arg icon_url "$status_icon_url" \
            --arg pr_url "$PR_URL" \
            --arg pr_number "$PR_NUMBER" \
            --arg pr_title "$PR_TITLE" \
            --arg author "$PR_AUTHOR" \
            --arg base "$PR_BASE" \
            --arg channel "$SLACK_CHANNEL_ID" \
            '{
                channel: $channel,
                text: $text,
                blocks: [
                {
                  type: "context",
                  elements: (
                    (if $icon_url == "" then [] else [{
                      type: "image",
                      image_url: $icon_url,
                      alt_text: $status
                    }] end) + [{
                      type: "mrkdwn",
                      text: ("*" + $status + "*")
                    }]
                  )
                },
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: ("<" + $pr_url + "|PR #" + $pr_number + ": " + $pr_title + ">")
                  }
                },
                {
                  type: "context",
                  elements: [{
                    type: "mrkdwn",
                    text: ("Author: " + $author + " | Base: " + $base)
                  }]
                }
              ]
            }')"

          if [[ -n "$SLACK_BOT_TOKEN" && -n "$SLACK_CHANNEL_ID" ]]; then
            response="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
              -H "Content-Type: application/json; charset=utf-8" \
              --data "$payload" \
              https://slack.com/api/chat.postMessage)"
            if ! jq -e '.ok == true' <<<"$response" >/dev/null; then
              error="$(jq -r '.error // "unknown_error"' <<<"$response")"
              echo "::error::Slack API rejected the PR notification: $error"
              exit 1
            fi
            if [[ "$PR_ACTION" == "closed" && "$PR_MERGED" == "true" ]]; then
              gh pr comment "$PR_NUMBER" --body "$merge_marker"
            fi
          else
            echo "::error::The azul.ai bot credentials are required to send PR notifications."
            exit 1
          fi
